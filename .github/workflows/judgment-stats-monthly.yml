name: 裁判書法官統計（每月增量）

on:
  schedule:
    - cron: '0 20 16 * *'  # 每月 16 日 UTC 20:00 = 台灣 17 日凌晨 4:00（官方約 15 日發布兩個月前的月包）
  workflow_dispatch:
    inputs:
      yyyymm:
        description: '要跑的月份（留空=自動抓兩個月前）'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full p7zip-rar

      - name: Resolve opendata.judicial.gov.tw via DoH（gov.tw DNS 拒答 Azure resolver）
        run: |
          IP=$(curl -s "https://dns.google/resolve?name=opendata.judicial.gov.tw&type=A" | jq -r '[.Answer[]? | select(.type==1)][0].data // empty')
          if [ -z "$IP" ]; then IP=210.69.124.89; fi
          echo "resolved: $IP"
          echo "$IP opendata.judicial.gov.tw" | sudo tee -a /etc/hosts

      - name: Run judgment stats pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JUDICIAL_OPENDATA_USER: ${{ secrets.JUDICIAL_OPENDATA_USER }}
          JUDICIAL_OPENDATA_PWD: ${{ secrets.JUDICIAL_OPENDATA_PWD }}
          SEVENZ_PATH: 7z
        working-directory: scripts
        run: |
          YM="${{ github.event.inputs.yyyymm }}"
          if [ -z "$YM" ]; then
            YM=$(date -u -d "$(date -u +%Y-%m-01) -2 months" +%Y%m)
          fi
          echo "目標月份: $YM"
          python judgment_stats.py run "$YM"

      - name: 共署 pair（重用本次已下載的月包 RAR）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEVENZ_PATH: 7z
        working-directory: scripts
        run: |
          YM="${{ github.event.inputs.yyyymm }}"
          if [ -z "$YM" ]; then
            YM=$(date -u -d "$(date -u +%Y-%m-01) -2 months" +%Y%m)
          fi
          python jy_copanel.py run "$YM"

      - name: Refresh 官方遷調邊（人審會決議 → judge_transfers → 異動歸因）
        # 全量重抓 65+ 頁約 3 分鐘；parse 有新句型警告會 exit 1 擋 upload（解析器要補樣態）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: |
          python jy_transfers.py list
          python jy_transfers.py fetch
          python jy_transfers.py parse
          python jy_transfers.py upload
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_judge_change_transfers" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}'

      - name: 回寫資料來源最後爬取時間
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sf -X PATCH "$SUPABASE_URL/rest/v1/data_sources?scraper_name=eq.judgment_stats" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"last_scraped_at\": \"$(date -u +%FT%TZ)\"}"
