name: 裁判書法官統計（每月增量）
run-name: 裁判書月更 ${{ github.event.inputs.yyyymm || '自動(兩個月前)' }}${{ github.event.inputs.force == 'true' && ' force' || '' }}

on:
  schedule:
    # 目標＝兩個月前的月包。官方約 15～16 日產包，但實際上架常再晚幾天（202606 到 8/20、
    # 202607 到 9/17 之後才查得到），所以同月試 4 次：UTC 16／19／22／26 日 20:00
    # ＝台灣 17／20／23／27 日凌晨 4:00。已上傳就跳過（約 1 分鐘、不寫 DB）；還沒上架不算失敗，
    # 只有最後一次仍抓不到才紅燈。⚠️ 改日期時 env.LAST_ATTEMPT_DAY 要跟著改成最後一個日期。
    - cron: '0 20 16,19,22,26 * *'
  workflow_dispatch:
    inputs:
      yyyymm:
        description: '要跑的月份（留空=自動抓兩個月前）'
        required: false
        default: ''
      force:
        description: '已上傳也強制重跑（整月刪後重插）；不勾＝已上傳就跳過'
        type: boolean
        required: false
        default: false

# 同月多次排程＋手動 dispatch 不要兩個同時跑（都是整月刪後重插，會撞唯一鍵）。
# 後到的排隊，輪到時 check 步驟會發現已上傳而跳過。
concurrency:
  group: judgment-stats-monthly
  cancel-in-progress: false

env:
  LAST_ATTEMPT_DAY: '26'  # UTC 日；＝上面 cron 的最後一個日期（本月最後一次排程）

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'  # log 即時輸出（否則 stdout 整段緩衝到結束，traceback 會排在前文之前）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          # 官方 7zz：ubuntu 的 p7zip 16.02（2016）解不開部分「Update」重打包月包
          curl -sL https://github.com/ip7z/7zip/releases/download/24.09/7z2409-linux-x64.tar.xz -o /tmp/7z.tar.xz
          sudo tar -xf /tmp/7z.tar.xz -C /usr/local/bin 7zz
          7zz | head -2

      - name: Resolve opendata.judicial.gov.tw via DoH（gov.tw DNS 拒答 Azure resolver）
        run: |
          IP=$(curl -s "https://dns.google/resolve?name=opendata.judicial.gov.tw&type=A" | jq -r '[.Answer[]? | select(.type==1)][0].data // empty')
          if [ -z "$IP" ]; then IP=210.69.124.89; fi
          echo "resolved: $IP"
          echo "$IP opendata.judicial.gov.tw" | sudo tee -a /etc/hosts

      - name: 決定目標月份
        id: plan
        env:
          INPUT_YM: ${{ github.event.inputs.yyyymm }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -n "$INPUT_YM" ]; then
            if ! [[ "$INPUT_YM" =~ ^[0-9]{6}$ ]]; then
              echo "::error::yyyymm 要是 6 位數字（例 202607），收到：$INPUT_YM"
              exit 1
            fi
            YM="$INPUT_YM"
            # 手動指定月份：排程只會重試「兩個月前」那個月，不保證替這個月再試 → 抓不到就該紅燈
            FINAL=true
          else
            YM=$(date -u -d "$(date -u +%Y-%m-01) -2 months" +%Y%m)
            # 排程（或留空手動）：UTC 日期已到本月最後一次排程日 → 這是最後一次嘗試
            if [ "$(date -u +%-d)" -ge "$LAST_ATTEMPT_DAY" ]; then FINAL=true; else FINAL=false; fi
          fi
          if [ "$INPUT_FORCE" = "true" ]; then FORCE=true; else FORCE=false; fi
          echo "目標月份: $YM（force=$FORCE，final=$FINAL）"
          { echo "ym=$YM"; echo "force=$FORCE"; echo "final=$FINAL"; } >> "$GITHUB_OUTPUT"

      - name: 檢查該月是否已上傳（已上傳的部分後面直接跳過，不重工）
        id: check
        if: steps.plan.outputs.force != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YM: ${{ steps.plan.outputs.ym }}
        working-directory: scripts
        run: |
          # 查詢本身失敗會讓這步紅燈（不會被當成「未上傳」而誤觸整月刪後重插）
          python - <<'PY'
          import os
          import urllib3
          urllib3.disable_warnings()
          import judgment_stats as js
          import jy_copanel

          ym = os.environ['YM']
          stats = js.month_uploaded(ym, full=True)  # 三表都有該月才算（防半殘月）
          copanel = jy_copanel.month_uploaded(ym)
          print(f'::notice::{ym}｜月表：{"已完整上傳→跳過" if stats else "未上傳→要跑"}'
                f'｜共署 pair：{"已上傳→跳過" if copanel else "未上傳→要跑"}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'stats={str(stats).lower()}\ncopanel={str(copanel).lower()}\n')
          PY

      - name: Run judgment stats pipeline
        id: stats
        if: steps.check.outputs.stats != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JUDICIAL_OPENDATA_USER: ${{ secrets.JUDICIAL_OPENDATA_USER }}
          JUDICIAL_OPENDATA_PWD: ${{ secrets.JUDICIAL_OPENDATA_PWD }}
          SEVENZ_PATH: 7zz
          YM: ${{ steps.plan.outputs.ym }}
          FINAL: ${{ steps.plan.outputs.final }}
        working-directory: scripts
        run: |
          rc=0
          python judgment_stats.py run "$YM" || rc=$?
          if [ "$rc" -eq 75 ]; then
            # 75 = judgment_stats.EXIT_NOT_PUBLISHED：平臺上還查不到該月資料集
            echo "state=unpublished" >> "$GITHUB_OUTPUT"
            if [ "$FINAL" = "true" ]; then
              echo "::error::$YM 裁判書月包在平臺上還查不到（尚未上架），之後沒有排程會再替這個月重試。上架後請手動補跑：gh workflow run judgment-stats-monthly.yml -f yyyymm=$YM"
              exit 1
            fi
            echo "::notice::$YM 裁判書月包尚未上架，本次不算失敗；本月後續排程（UTC 16／19／22／26 日 20:00）會再試"
            exit 0
          fi
          if [ "$rc" -eq 76 ]; then
            # 76 = judgment_stats.EXIT_REFRESH_FAILED：月表已落地，但 refresh 鏈有項目沒完成。
            # 這步先不紅：後面的共署 pair／遷調邊／last_scraped_at 和 refresh 鏈無關、照跑，
            # 由最後一步統一紅燈。之後的排程會因「已上傳」跳過月表步驟，不會自動補 refresh。
            { echo "state=uploaded"; echo "refresh_failed=true"; } >> "$GITHUB_OUTPUT"
            echo "::error::$YM 月表已上傳，但 refresh 鏈有項目沒完成（見本步驟 log 的「refresh 摘要」）。排除原因後在本機補跑：python scripts/judgment_stats.py refresh"
            exit 0
          fi
          if [ "$rc" -eq 0 ]; then echo "state=uploaded" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      - name: 共署 pair（重用本次已下載的月包 RAR；月表步驟被跳過時自己下載）
        id: copanel
        if: steps.check.outputs.copanel != 'true' && steps.stats.outputs.state != 'unpublished'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 月表步驟被跳過（已上傳）時這裡沒有現成 RAR，要自己登入下載
          JUDICIAL_OPENDATA_USER: ${{ secrets.JUDICIAL_OPENDATA_USER }}
          JUDICIAL_OPENDATA_PWD: ${{ secrets.JUDICIAL_OPENDATA_PWD }}
          SEVENZ_PATH: 7zz
          YM: ${{ steps.plan.outputs.ym }}
        working-directory: scripts
        run: python jy_copanel.py run "$YM"

      - name: Refresh 官方遷調邊（人審會決議 → judge_transfers → 異動歸因）
        # 全量重抓 65+ 頁約 3 分鐘；parse 有新句型警告會 exit 1 擋 upload（解析器要補樣態）
        # 只在本次真的有新資料落地時跑（月表或共署 pair 有實際上傳）；整個 run 都是跳過時不重抓
        if: steps.stats.outputs.state == 'uploaded' || steps.copanel.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: |
          SUPABASE_URL="$(printf %s "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_SERVICE_KEY="$(printf %s "$SUPABASE_SERVICE_KEY" | tr -d '[:space:]')"
          python jy_transfers.py list
          python jy_transfers.py fetch
          python jy_transfers.py parse
          python jy_transfers.py upload
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_judge_change_transfers" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}'

      - name: 回寫資料來源最後爬取時間
        # 只在本次月表真的落地時回寫（跳過／尚未上架的 run 不動它）；後面的共署 pair／遷調邊
        # 就算失敗也照寫——之後的重試 run 月表會被跳過，這裡不寫就永遠不會寫
        if: ${{ !cancelled() && steps.stats.outputs.state == 'uploaded' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # secrets 可能帶尾端空白/換行，curl 不像 Python 會 strip，會讓 PostgREST 回 400
          SUPABASE_URL="$(printf %s "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_SERVICE_KEY="$(printf %s "$SUPABASE_SERVICE_KEY" | tr -d '[:space:]')"
          http_code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X PATCH "$SUPABASE_URL/rest/v1/data_sources?scraper_name=eq.judgment_stats" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"last_scraped_at\": \"$(date -u +%FT%TZ)\"}")
          echo "PATCH data_sources: HTTP $http_code"
          case "$http_code" in
            2??) ;;
            # 4xx＝表／欄位／權限出問題，不會自己好 → 紅燈；其餘（5xx）下次排程會重寫，只警告
            4??) echo "::error::last_scraped_at 回寫失敗 HTTP $http_code"; head -c 300 /tmp/resp.txt; echo; exit 1 ;;
            *) echo "::warning::last_scraped_at 回寫失敗 HTTP $http_code"; head -c 300 /tmp/resp.txt; echo ;;
          esac

      - name: refresh 鏈沒跑完 → 紅燈
        # 放最後：月表步驟回 76 時先讓前面幾步照跑，再由這裡把整個 run 標成失敗
        if: ${{ !cancelled() && steps.stats.outputs.refresh_failed == 'true' }}
        run: |
          echo "::error::月表已落地，但 refresh 鏈有項目沒完成。看「Run judgment stats pipeline」步驟 log 的「refresh 摘要」，排除原因後在本機補跑：python scripts/judgment_stats.py refresh"
          exit 1
