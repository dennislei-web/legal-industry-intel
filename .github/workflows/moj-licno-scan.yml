name: MOJ 律師補掃（證號遍歷）

on:
  schedule:
    - cron: '0 18 * * 6'  # 每週六 UTC 18:00 = 台灣週日凌晨 2:00（發現新律師，只掃近年）
    - cron: '0 18 1 * *'  # 每月 1 日 UTC 18:00 = 台灣 2 日凌晨 2:00（全年份洞補掃 92~最新，
                          # 抓「早年掃描時查無、之後回役」的律師；約 5,000 查詢、3~5.5 小時）
  workflow_dispatch:
    inputs:
      years:
        description: '要掃的年份（留空=自動掃 92~最新；可輸入逗號分隔，例如 112,113,114,115）'
        required: false
        default: ''
      detail_fetch:
        description: '掃完後是否補抓詳細資料'
        required: false
        default: 'true'

# 兩條 cron 可能同日觸發（每月 1 日恰為週六時）；排隊不並行，避免同時打 MOJ API + 重複掃描
concurrency:
  group: moj-licno-scan
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run 證號遍歷
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: |
          YEARS="${{ github.event.inputs.years }}"
          # 每週 cron 只掃近年（發現新律師）；每月 1 日 cron 保持 YEARS 空 → 全年份洞補掃
          if [ -z "$YEARS" ] && [ "${{ github.event_name }}" = "schedule" ] \
             && [ "${{ github.event.schedule }}" != "0 18 1 * *" ]; then
            YEARS="112,113,114,115"
          fi
          if [ -z "$YEARS" ]; then
            echo "=== 證號遍歷（自動：92~最新）==="
            python moj_licno_scan.py
          else
            ARGS=$(echo "$YEARS" | tr ',' ' ')
            echo "=== 證號遍歷（指定年份：$ARGS）==="
            python moj_licno_scan.py $ARGS
          fi

      - name: Refresh all caches (with retry)
        id: refresh
        # 這步失敗先不擋後面的 detail fetch（和快取刷新無關、照跑），由最後一步統一紅燈
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # 重試與紅綠燈規則在 script 裡：5xx／連線錯誤重試 3 次；4xx 或重試後仍失敗 → 清單跑完後 exit 1
        # refresh_ex_judicial_lawyers：新發現的律師若是退場法官/檢察官，讓「轉任律師」
        # 比對每週隨掃描更新（原本只掛月更 causefill，退場法官名冊追蹤會晚一個月）
        run: bash .github/scripts/refresh-rpcs.sh refresh_firm_stats_cache refresh_lawyer_stats refresh_ex_judicial_lawyers

      # 每月全掃（schedule 且 cron 為 0 18 1 * *）跳過 detail fetch：
      # 全掃本身要 3~5.5 小時，runner 上限 6 小時；新發現律師的 detail 由每週 job 補
      - name: Wait for cache refresh to settle
        if: github.event.inputs.detail_fetch == 'true' || (github.event_name == 'schedule' && github.event.schedule != '0 18 1 * *')
        run: |
          echo "Sleep 90s 讓 refresh_firm_stats_cache 在 Supabase 跑完，避免下個 step 撞鎖"
          sleep 90

      - name: Fetch lawyer details
        if: github.event.inputs.detail_fetch == 'true' || (github.event_name == 'schedule' && github.event.schedule != '0 18 1 * *')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: python moj_lawyer_detail_fetch.py 2000

      - name: 快取刷新失敗 → 紅燈
        # 放最後：refresh 步驟失敗時先讓 detail fetch 照跑，再由這裡把整個 run 標成失敗
        if: ${{ !cancelled() && steps.refresh.outcome == 'failure' }}
        run: |
          echo "::error::快取刷新失敗：哪支 RPC、回了什麼，看「Refresh all caches (with retry)」步驟的 log"
          exit 1
