name: MOJ 律師補掃（證號遍歷）

on:
  schedule:
    - cron: '0 18 * * 6'  # 每週六 UTC 18:00 = 台灣週日凌晨 2:00（發現新律師，只掃近年）
    - cron: '0 18 1 * *'  # 每月 1 日 UTC 18:00 = 台灣 2 日凌晨 2:00（全年份洞補掃 92~最新，
                          # 抓「早年掃描時查無、之後回役」的律師；約 5,000 查詢、3~5.5 小時）
  workflow_dispatch:
    inputs:
      years:
        description: '要掃的年份（留空=自動掃 92~最新；可輸入逗號分隔，例如 112,113,114,115）'
        required: false
        default: ''
      detail_fetch:
        description: '掃完後是否補抓詳細資料'
        required: false
        default: 'true'

# 兩條 cron 可能同日觸發（每月 1 日恰為週六時）；排隊不並行，避免同時打 MOJ API + 重複掃描
concurrency:
  group: moj-licno-scan
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run 證號遍歷
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: |
          YEARS="${{ github.event.inputs.years }}"
          # 每週 cron 只掃近年（發現新律師）；每月 1 日 cron 保持 YEARS 空 → 全年份洞補掃
          if [ -z "$YEARS" ] && [ "${{ github.event_name }}" = "schedule" ] \
             && [ "${{ github.event.schedule }}" != "0 18 1 * *" ]; then
            YEARS="112,113,114,115"
          fi
          if [ -z "$YEARS" ]; then
            echo "=== 證號遍歷（自動：92~最新）==="
            python moj_licno_scan.py
          else
            ARGS=$(echo "$YEARS" | tr ',' ' ')
            echo "=== 證號遍歷（指定年份：$ARGS）==="
            python moj_licno_scan.py $ARGS
          fi

      - name: Refresh all caches (with retry)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # 剛跑完大量寫入，Supabase 可能還忙。用長 timeout + 重試確保真的 refresh 到
          # secrets 可能帶尾端空白/換行，會讓 PostgREST 回 400 PGRST102（curl 不像 Python 會 strip）
          SUPABASE_URL="$(printf %s "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_SERVICE_KEY="$(printf %s "$SUPABASE_SERVICE_KEY" | tr -d '[:space:]')"
          # refresh_ex_judicial_lawyers：新發現的律師若是退場法官/檢察官，讓「轉任律師」
          # 比對每週隨掃描更新（原本只掛月更 causefill，退場法官名冊追蹤會晚一個月）
          for rpc in refresh_firm_stats_cache refresh_lawyer_stats refresh_ex_judicial_lawyers; do
            success=0
            for attempt in 1 2 3; do
              http_code=$(curl -sk -o /tmp/resp.txt -w "%{http_code}" \
                --max-time 180 \
                -X POST "$SUPABASE_URL/rest/v1/rpc/${rpc}" \
                -H "apikey: $SUPABASE_SERVICE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
                -H "Content-Type: application/json" -d '{}' 2>&1 || echo "ERR")
              echo "${rpc} attempt ${attempt}: HTTP $http_code"
              case "$http_code" in
                204|200) echo "  ✅ OK"; success=1; break ;;
                5*|52*|ERR) echo "  retrying in 60s..."; sleep 60 ;;
                *) echo "::warning::${rpc} returned $http_code"; cat /tmp/resp.txt | head -c 300; echo; break ;;
              esac
            done
            [ $success -eq 0 ] && echo "::warning::${rpc} failed after retries (non-fatal, 下次爬蟲會重刷)" || true
          done

      # 每月全掃（schedule 且 cron 為 0 18 1 * *）跳過 detail fetch：
      # 全掃本身要 3~5.5 小時，runner 上限 6 小時；新發現律師的 detail 由每週 job 補
      - name: Wait for cache refresh to settle
        if: github.event.inputs.detail_fetch == 'true' || (github.event_name == 'schedule' && github.event.schedule != '0 18 1 * *')
        run: |
          echo "Sleep 90s 讓 refresh_firm_stats_cache 在 Supabase 跑完，避免下個 step 撞鎖"
          sleep 90

      - name: Fetch lawyer details
        if: github.event.inputs.detail_fetch == 'true' || (github.event_name == 'schedule' && github.event.schedule != '0 18 1 * *')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: python moj_lawyer_detail_fetch.py 2000
