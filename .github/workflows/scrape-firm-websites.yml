name: 搜尋事務所官網

on:
  schedule:
    - cron: '40 20 * * *'  # 每日 UTC 20:40 = 台灣凌晨 4:40
  workflow_dispatch:
    inputs:
      batch_size:
        description: '爬取筆數 (0 = 全部)'
        required: false
        default: '0'
      scrape_delay:
        description: '每次搜尋間隔秒數'
        required: false
        default: '1.8'
      retry_missing:
        description: '重試未找到官網的事務所'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~5.8 小時，足以跑 5900 間 × 1.8s ≈ 3 hr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Search firm websites
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '0' }}
          SCRAPE_DELAY: ${{ github.event.inputs.scrape_delay || '1.8' }}
          RETRY_MISSING: ${{ github.event.inputs.retry_missing || 'false' }}
        working-directory: scripts
        run: python scrape_firm_websites.py

      - name: 重建事務所快取（前端「有官網」卡讀 moj_firm_stats_cache，不刷新不會反映新官網）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          SUPABASE_URL="$(printf %s "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_SERVICE_KEY="$(printf %s "$SUPABASE_SERVICE_KEY" | tr -d '[:space:]')"
          http_code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 120 -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_firm_stats_cache" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}') || true
          echo "refresh_firm_stats_cache: HTTP $http_code"

      - name: 回寫資料來源最後爬取時間
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # secrets 可能帶尾端空白/換行，curl 不像 Python 會 strip，會讓 PostgREST 回 400
          SUPABASE_URL="$(printf %s "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_SERVICE_KEY="$(printf %s "$SUPABASE_SERVICE_KEY" | tr -d '[:space:]')"
          http_code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X PATCH "$SUPABASE_URL/rest/v1/data_sources?scraper_name=eq.firm_websites" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"last_scraped_at\": \"$(date -u +%FT%TZ)\"}")
          echo "PATCH data_sources: HTTP $http_code"
          [ "$http_code" = "204" ] || { echo "::warning::last_scraped_at 回寫失敗 HTTP $http_code"; head -c 300 /tmp/resp.txt; echo; }
