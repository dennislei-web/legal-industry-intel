name: CRM 法官/檢察官內部紀錄爬取

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '只處理前 N 位（測試用，留空=全部）'
        required: false
        default: ''
      sample:
        description: 'dump HTML 樣本為 artifact（true/false，解析除錯用）'
        required: false
        default: 'false'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run CRM officer crawl
        env:
          CRM_EMAIL: ${{ secrets.CRM_EMAIL }}
          CRM_PASSWORD: ${{ secrets.CRM_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: |
          ARGS=""
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "${{ github.event.inputs.sample }}" = "true" ]; then ARGS="$ARGS --sample"; fi
          python crm_officer_crawl.py $ARGS
        # 注意：本 repo 是 PUBLIC，Actions log 公開可見——爬蟲 log 僅印計數不印人名/內容，
        # 且絕不上傳任何 artifact（HTML 樣本與備份含內部評論，只允許留在 runner 端隨即銷毀）。
