name: 爬取 Lawsnote 律師個人資料

on:
  schedule:
    # 每週一次即可：backlog 已清空（每小時跑只會空轉），僅為週更名冊帶進的新律師做 enrichment
    - cron: '0 20 * * 0'  # 每週日 UTC 20:00 = 台灣週一凌晨 4:00（接在週更律師名冊爬蟲之後）
  workflow_dispatch:
    inputs:
      batch_size:
        description: '每批處理筆數'
        required: false
        default: '600'
      rescrape_cert:
        description: '重新爬取缺少證書字號的律師'
        type: boolean
        required: false
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run profile scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '600' }}
          RESCRAPE_MISSING_CERT: ${{ github.event.inputs.rescrape_cert || 'false' }}
        working-directory: scripts
        run: python scrape_lawsnote_profiles.py
