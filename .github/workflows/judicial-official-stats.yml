# 2026-11-06 起只留手動備援（workflow_dispatch），每月排程已搬到本機 Windows 排程 judicial-official-stats-monthly
# （每日 10:30 觸發，scripts/judicial_official_stats_monthly.py 自判「≥5 日且本月未跑」才跑 run 並 PATCH last_scraped_at；
#   每日觸發是因為雷晚上關機、月更型排程漏跑不會補跑）。
# 原因：GitHub runner（海外 IP）連 opendata.judicial.gov.tw 被擋——
#   2026-11-05 排程、11-06 手動重跑連兩天 connect timeout（DoH 解析到的 IP 一樣連不上）；
#   本機對同一個 IP 0.07 秒即通，11-06 本機手動跑過一次成功。
# 本機漏跑時可在這裡手動 Run workflow 補一次（全量 upsert 冪等）；也省 GitHub Actions 分鐘數。
name: 司法院官方案件統計（手動備援）

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve opendata.judicial.gov.tw via DoH（gov.tw DNS 拒答 Azure resolver）
        run: |
          IP=$(curl -s "https://dns.google/resolve?name=opendata.judicial.gov.tw&type=A" | jq -r '[.Answer[]? | select(.type==1)][0].data // empty')
          if [ -z "$IP" ]; then IP=210.69.124.89; fi
          echo "resolved: $IP"
          echo "$IP opendata.judicial.gov.tw" | sudo tee -a /etc/hosts

      - name: Run official court stats pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: python judicial_official_stats.py run

      - name: 回寫資料來源最後爬取時間
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # secrets 可能帶尾端空白/換行，curl 不像 Python 會 strip，會讓 PostgREST 回 400
          SUPABASE_URL="$(printf %s "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_SERVICE_KEY="$(printf %s "$SUPABASE_SERVICE_KEY" | tr -d '[:space:]')"
          http_code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X PATCH "$SUPABASE_URL/rest/v1/data_sources?scraper_name=eq.judicial_official_stats" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"last_scraped_at\": \"$(date -u +%FT%TZ)\"}")
          echo "PATCH data_sources: HTTP $http_code"
          case "$http_code" in
            2??) ;;
            # 4xx＝表／欄位／權限出問題，不會自己好 → 紅燈；其餘（5xx）下次排程會重寫，只警告
            4??) echo "::error::last_scraped_at 回寫失敗 HTTP $http_code"; head -c 300 /tmp/resp.txt; echo; exit 1 ;;
            *) echo "::warning::last_scraped_at 回寫失敗 HTTP $http_code"; head -c 300 /tmp/resp.txt; echo ;;
          esac
