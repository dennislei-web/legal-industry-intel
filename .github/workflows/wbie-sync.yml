name: 職安署霸凌調查專家名冊同步

on:
  # ⚠️ 無排程：etms.osha.gov.tw 擋海外 IP（GH runner Errno 101 network unreachable，
  # 2026-08-04 實測）。每日同步走本機 Windows 工作排程器（wbie_sync_daily，台北 03:10，
  # 比照 law010 系列本機排程）。此 workflow 僅留手動觸發備用（若官方日後解除封鎖可恢復 cron）。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wbie-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run wbie_sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: python -u wbie_sync.py
