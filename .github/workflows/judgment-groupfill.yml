name: 所級去重素材回填（groupfill）

# mig 186/189：同一裁判書共同署名律師集合 → lawyer_group_month_stats（所級去重）＋
# lawyer_group_court_month_stats（法院×案類維度，事務所版圖去重）。
# 模式同 judgment-doctypefill.yml：groupfill 冪等（已上傳月自動跳過、失敗月重 dispatch 補），
# 只傳兩張 group 表（其餘月表內容不變；pair 三表滾動視窗不重灌）。
# 全量 = 202101 起到名目資料最新月（去重口徑起點 202101）；default ranges 過時可用 inputs 覆蓋。

on:
  workflow_dispatch:
    inputs:
      ranges_json:
        description: '月份區間 shards（JSON array，格式 "起-迄"）'
        required: false
        default: '["202101-202112","202201-202212","202301-202312","202401-202412","202501-202512","202601-202605"]'

concurrency:
  group: judgment-groupfill
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        range: ${{ fromJSON(github.event.inputs.ranges_json || '["202101-202112","202201-202212","202301-202312","202401-202412","202501-202512","202601-202605"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          # 官方 7zz：ubuntu 的 p7zip 16.02（2016）解不開部分「Update」重打包月包
          curl -sL https://github.com/ip7z/7zip/releases/download/24.09/7z2409-linux-x64.tar.xz -o /tmp/7z.tar.xz
          sudo tar -xf /tmp/7z.tar.xz -C /usr/local/bin 7zz
          7zz | head -2

      - name: Resolve opendata.judicial.gov.tw via DoH（gov.tw DNS 拒答 Azure resolver）
        run: |
          IP=$(curl -s "https://dns.google/resolve?name=opendata.judicial.gov.tw&type=A" | jq -r '[.Answer[]? | select(.type==1)][0].data // empty')
          if [ -z "$IP" ]; then IP=210.69.124.89; fi
          echo "resolved: $IP"
          echo "$IP opendata.judicial.gov.tw" | sudo tee -a /etc/hosts

      - name: Groupfill ${{ matrix.range }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JUDICIAL_OPENDATA_USER: ${{ secrets.JUDICIAL_OPENDATA_USER }}
          JUDICIAL_OPENDATA_PWD: ${{ secrets.JUDICIAL_OPENDATA_PWD }}
          SEVENZ_PATH: 7zz
        working-directory: scripts
        run: |
          RANGE="${{ matrix.range }}"
          python judgment_stats.py groupfill "${RANGE%-*}" "${RANGE#*-}"

  refresh:
    runs-on: ubuntu-latest
    needs: shard
    if: always()   # 部分 shard 失敗也先 refresh（缺月重 dispatch 補跑即可）
    timeout-minutes: 30
    steps:
      - name: Refresh 所×月去重 cache + 檢查缺月
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pip install -q requests
          python - <<'EOF'
          import os, requests, sys
          url = os.environ['SUPABASE_URL'].strip()
          key = os.environ['SUPABASE_SERVICE_KEY'].strip()
          H = {'apikey': key, 'Authorization': f'Bearer {key}'}
          # 逐月打單月增量版（全量 p_ym=NULL ~10s 會撞 PostgREST 8s statement_timeout）。
          # 範圍動態取自名目月表（寫死迄月曾漏刷 202505+，2026-09-01 事故）；
          # 素材齊全檢查看 mig 189 新表（lawyer_group_court_month_stats）。
          def edge(order):
              r = requests.get(f'{url}/rest/v1/lawyer_month_stats',
                               params={'select': 'yyyymm', 'order': f'yyyymm.{order}', 'limit': 1},
                               headers=H, timeout=30)
              return r.json()[0]['yyyymm']
          lo, hi = edge('asc'), edge('desc')
          if lo < '202101': lo = '202101'   # 去重口徑起點
          missing, bad = [], []
          y, m = int(lo[:4]), int(lo[4:])
          while (y, m) <= (int(hi[:4]), int(hi[4:])):
              ym = f'{y}{m:02d}'
              r = requests.get(f'{url}/rest/v1/lawyer_group_court_month_stats',
                               params={'ym': f'eq.{ym}', 'select': 'ym', 'limit': 1},
                               headers=H, timeout=30)
              if not r.json():
                  missing.append(ym)
              else:
                  for rpc in ('refresh_firm_dedup_stats', 'refresh_firm_court_dup'):
                      r = requests.post(f'{url}/rest/v1/rpc/{rpc}',
                                        json={'p_ym': ym},
                                        headers={**H, 'Content-Type': 'application/json'}, timeout=60)
                      if not r.ok:
                          bad.append(f'{ym}:{rpc}')
                          print(f'refresh {ym} {rpc}: HTTP {r.status_code} {r.text[:120]}')
              m += 1
              if m > 12: y, m = y + 1, 1
          print('缺 lawyer_group_court 的月份:', missing or '無 ✅')
          print('refresh 失敗的月份:', bad or '無 ✅')
          if missing or bad:
              sys.exit(1)  # 讓 run 標紅，提醒重 dispatch 補跑
          EOF
