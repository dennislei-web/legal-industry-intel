name: MOJ 律師異動刷新（事務所/執業狀態）

on:
  schedule:
    - cron: '0 17 * * *'  # 每日 UTC 17:00 = 台灣凌晨 1:00，按星期分片，一週刷完全部律師
  workflow_dispatch:
    inputs:
      shard:
        description: '分片編號 0~6（留空=依今天星期自動選）'
        required: false
        default: ''
      limit:
        description: '只處理前 N 筆（測試用，留空=整個分片）'
        required: false
        default: ''

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run office refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: |
          SHARD="${{ github.event.inputs.shard }}"
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$SHARD" ]; then
            SHARD=$(( $(date +%u) % 7 ))  # 0~6，依星期自動輪替
          fi
          echo "=== 分片 $SHARD/7 ==="
          python moj_office_refresh.py --shard "$SHARD" 7 $LIMIT

      - name: Refresh all caches (with retry)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # 重試與紅綠燈規則在 script 裡：5xx／連線錯誤重試 3 次；4xx 或重試後仍失敗 → 清單跑完後 job 紅燈
        run: bash .github/scripts/refresh-rpcs.sh refresh_firm_stats_cache refresh_lawyer_stats refresh_firm_map_cache
