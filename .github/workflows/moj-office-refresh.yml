name: MOJ 律師異動刷新（事務所/執業狀態）

on:
  schedule:
    - cron: '0 17 * * *'  # 每日 UTC 17:00 = 台灣凌晨 1:00，按星期分片，一週刷完全部律師
  workflow_dispatch:
    inputs:
      shard:
        description: '分片編號 0~6（留空=依今天星期自動選）'
        required: false
        default: ''
      limit:
        description: '只處理前 N 筆（測試用，留空=整個分片）'
        required: false
        default: ''

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run office refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: |
          SHARD="${{ github.event.inputs.shard }}"
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$SHARD" ]; then
            SHARD=$(( $(date +%u) % 7 ))  # 0~6，依星期自動輪替
          fi
          echo "=== 分片 $SHARD/7 ==="
          python moj_office_refresh.py --shard "$SHARD" 7 $LIMIT

      - name: Refresh all caches (with retry)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # 剛跑完寫入，Supabase 可能還忙。用長 timeout + 重試確保真的 refresh 到
          for rpc in refresh_firm_stats_cache refresh_lawyer_stats; do
            success=0
            for attempt in 1 2 3; do
              http_code=$(curl -sk -o /tmp/resp.txt -w "%{http_code}" \
                --max-time 180 \
                -X POST "$SUPABASE_URL/rest/v1/rpc/${rpc}" \
                -H "apikey: $SUPABASE_SERVICE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
                -H "Content-Type: application/json" -d '{}' 2>&1 || echo "ERR")
              echo "${rpc} attempt ${attempt}: HTTP $http_code"
              case "$http_code" in
                204|200) echo "  ✅ OK"; success=1; break ;;
                5*|52*|ERR) echo "  retrying in 60s..."; sleep 60 ;;
                *) echo "::warning::${rpc} returned $http_code"; cat /tmp/resp.txt | head -c 300; echo; break ;;
              esac
            done
            [ $success -eq 0 ] && echo "::warning::${rpc} failed after retries (non-fatal, 下次爬蟲會重刷)"
          done
